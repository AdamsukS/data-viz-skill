interface:
  display_name: "Data Viz"
  short_description: "Compact statistical figures with labeled panels"
  default_prompt: "Use $data-viz from https://github.com/AdamsukS/data-viz-skill to reuse suitable plotting code wherever practical, suggest useful missing inputs such as repeated experiment results, and create a compact figure with complementary statistical layers. Keep analysis, captions, titles and descriptive prose outside the image; retain essential axes, units, legends and data labels, and mark main panels (a), (b), (c), etc."
